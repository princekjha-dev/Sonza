name: Build & Release SONZA APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || {
            echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "(e: [^ ]+\.kt|error: |Unresolved reference|Compilation error)" build_output.log -B 2 -A 4 | head -n 80 >> $GITHUB_STEP_SUMMARY || tail -n 80 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Named APK Artifacts
        run: |
          mkdir -p build-apks
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ]; then
            VERSION_TAG="v2.6.5.0"
          fi
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "build-apks/SONZA-${VERSION_TAG}.apk"
            ls -la build-apks/
          else
            echo "::error::No APK files found in app/build/outputs/apk"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONZA-v2.6.5.0
          path: build-apks/*.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: SONZA ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🎧 SONZA — Hear Music Differently.
            
            ### High-Fidelity Audiophile Playback & Social Listening
            - Lossless bit-perfect playback (FLAC / 24-bit / 96kHz / 192kHz)
            - 10-Band Parametric Equalizer (-12dB to +12dB) & DSP curve visualizer
            - Binaural Spatial Audio & Stereo Expander
            - Real-time Synchronized Lyrics with word-level highlighting
            - Social Listen Together synchronized listening rooms
            - ReplayGain Loudness Normalization & anti-clipping limiter
            - Beat-synchronized musical haptics
            - Native Android MediaStore local library scanner
            - Spotify Playlist metadata importer
            
            ### 📱 Installation Instructions:
            1. Download `SONZA-${{ github.ref_name }}.apk` below directly onto your Android phone.
            2. Tap to install (enable "Install from unknown sources" if prompted).
            3. Enjoy high-fidelity audio!
          files: build-apks/SONZA-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

